<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.pageTitle">African Language Map — Nerala</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <!-- MarkerCluster CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <div id="header">
      <div class="logo" id="header-logo" data-i18n="meta.headerLogo">NeraMap Africa</div>
      <div class="subtitle" id="header-subtitle" data-i18n="meta.headerSubtitle">
        Linguistic Atlas · Central & West Africa
      </div>

      <!-- Scalable Country selector dropdown -->
      <div id="country-nav" class="country-select-wrap">
        <select id="country-select" data-i18n-aria-label="nav.countrySelectAria" aria-label="Country Selection">
          <option value="ALL" data-i18n="nav.allAfrica">Africa</option>
          <option value="CM" data-i18n="nav.cameroon">Cameroon (253)</option>
          <option value="NG" data-i18n="nav.nigeria">Nigeria (561)</option>
          <option value="TD" data-i18n="nav.chad">Chad (141)</option>
          <option value="GA" data-i18n="nav.gabon">Gabon (48)</option>
        </select>
      </div>

      <!-- Mode navigation tabs -->
      <nav id="mode-nav" data-i18n-aria-label="nav.modeNavAria" aria-label="Visualization modes">
        <button class="mode-btn active" data-mode="map" data-i18n="nav.modeMap">Map & Atlas</button>
        <button class="mode-btn" data-mode="sunburst" data-i18n="nav.modeStudio">Studio & Choropleth</button>
      </nav>

      <!-- Language Switcher -->
      <div id="lang-switcher" aria-label="Language selection">
        <button class="lang-pill active" data-lang="en" title="English">EN</button>
        <button class="lang-pill" data-lang="fr" title="Français">FR</button>
      </div>

      <div class="counter">
        <span data-i18n="nav.shownCountLabel">Showing:</span> <span id="shown-count">0</span> <span data-i18n="nav.languagesCount">languages</span>
      </div>
    </div>

    <!-- Search -->
    <div id="search-wrap">
      <input
        id="search-input"
        type="text"
        data-i18n-placeholder="search.placeholder"
        placeholder="Search for a language, family, or region…"
      />
    </div>

    <!-- View switcher -->
    <div id="view-switcher" data-i18n-aria-label="nav.viewSwitcherAria" aria-label="Map view choice"></div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Studio Viewport for interactive visualizations -->
    <div id="viz-studio-container" style="display: none;"></div>

    <!-- Legend
    <div id="legend">
      <h4 data-i18n="legend.familiesTitle">Language Families</h4>
      <div class="legend-row">
        <div class="legend-dot" style="background: var(--niger-congo)"></div>

    <!-- Brand mark -->
    <a id="brand-mark" href="https://nerala.app" data-i18n-aria-label="hints.backToHomeAria" aria-label="Return to home">
      <img
        src="public/logo/nerala-map-removebg-preview.png"
        alt="Logo Nerala"
      />
    </a>

    <!-- Info Panel -->
    <div id="info-panel">
      <button class="close-btn" id="close-panel" data-i18n-aria-label="hints.closePanelAria" aria-label="Close info panel">✕</button>
      <div id="panel-content"></div>
    </div>

    <!-- Zoom hint -->
    <div id="zoom-hint" data-i18n="hints.zoomHintClusters">Zoom in to explore clusters</div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Validated multi-source language datasets -->
    <script src="data/languages/CM.js"></script>
    <script src="data/languages/NG.js"></script>
    <script src="data/languages/TD.js"></script>
    <script src="data/languages/GA.js"></script>
    <script src="data/geo-regions.js"></script>
    <script src="data/viz-data.js"></script>

    <!-- Localization system (loads before other modules) -->
    <script src="js/i18n.js"></script>

    <!-- NeraMap modular scripts (load order matters) -->
    <script src="js/config.js"></script>
    <script src="js/tile-cache.js"></script>
    <script src="js/data.js"></script>
    <script src="js/country-filter.js"></script>
    <script src="js/map-init.js"></script>
    <script src="js/markers.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/search-filters.js"></script>

    <!-- Data Viz Studio modules -->
    <script src="js/viz-voronoi.js"></script>
    <script src="js/viz-sunburst.js"></script>
    <script src="js/viz-studio.js"></script>

    <!-- Main entry point -->
    <script src="js/main.js"></script>
  </body>
</html>
